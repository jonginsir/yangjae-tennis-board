name: discover
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python discover/discover.py
      - name: 결과를 discover-out 브랜치에 저장
        if: always()
        run: |
          cd discover-out
          git init -q -b discover-out
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "discover output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" discover-out
