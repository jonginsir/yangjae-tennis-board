name: keepalive
# GitHub은 60일간 저장소 활동이 없으면 예약 실행을 멈춘다.
# 매달 1일·15일에 작은 기록 커밋을 남겨 활동이 끊기지 않게 한다.
# (GITHUB_TOKEN으로 만든 커밋은 다른 워크플로우를 다시 실행시키지 않음)
on:
  schedule:
    - cron: "7 0 1,15 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name github-actions
          git config user.email actions@github.com
          git add .github/keepalive
          git commit -m "keepalive" && git push
