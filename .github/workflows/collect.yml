name: collect
on:
  schedule:
    - cron: "*/15 * * * *"   # 15분 간격 (GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - name: 테스트 (실패하면 배포하지 않음)
        run: python -m pytest -q
      - name: 수집
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p site && cp -r web/. site/
          python -m collector.run
      - name: 최신 data.json을 data 브랜치에도 보관 (점검용)
        run: |
          cd site && rm -rf .git && git init -q -b data
          git config user.name github-actions && git config user.email actions@github.com
          git add data.json && git commit -qm "data snapshot"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
