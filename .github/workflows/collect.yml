name: collect
on:
  schedule:
    - cron: "*/15 * * * *"   # 15분 간격 (GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:
    inputs:
      test_alert:
        description: 텔레그램 테스트 메시지 보내기
        type: boolean
        default: false
      send_current:
        description: 지금 실내 빈자리 목록 보내기
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - name: 테스트 (실패하면 배포하지 않음)
        run: python -m pytest -q
      - name: 수집
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.test_alert }}
          SEND_CURRENT: ${{ inputs.send_current }}
        run: |
          mkdir -p site && cp -r web/. site/
          python -m collector.run
      - name: 실패 알림 (직전 실행이 성공이었을 때 한 번만)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?status=completed&per_page=1" -q '.workflow_runs[0].conclusion' || echo unknown)
          echo "previous: $last"
          if [ "$last" = "success" ]; then
            python -c "from collector.run import send; send('⚠️ 양재 보드 수집이 실패했어요. 보드가 갱신되지 않고 있어요. 고쳐지면 다시 알려드려요.\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
          fi
      - name: 최신 data.json을 data 브랜치에도 보관 (점검용)
        run: |
          cd site && rm -rf .git && git init -q -b data
          git config user.name github-actions && git config user.email actions@github.com
          git add data.json && git commit -qm "data snapshot"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
